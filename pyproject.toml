[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# "watchtower" on PyPI is an unrelated AWS CloudWatch logging handler. Both the
# distribution *and* the import package are watchtower_tui to stay clear of it:
# renaming only the distribution is not enough, because the import name is what
# actually collides - installing over it silently replaces the other package.
# The command is still plain "watchtower"; console scripts do not collide.
name = "watchtower-tui"
version = "0.2.2"
description = "A small terminal dashboard for the usage limits on your Codex and Claude accounts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Watchtower contributors" }]
keywords = ["tui", "terminal", "usage", "quota", "codex", "claude", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "keyring>=24.0",
    "cryptography>=42.0",
    "platformdirs>=4.0",
    # Real provider icons. Not optional: logo_style defaults to "image", and an
    # optional dependency that the default setting needs is a contradiction.
    # They cost about 7 MB and degrade to the dot marks on their own wherever
    # the terminal has no graphics protocol.
    "textual-image>=0.7",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Kept as an empty alias so `pip install watchtower-tui[images]` still resolves
# for anyone who followed the 0.2.0 instructions. The packages it used to pull
# in are ordinary dependencies now.
images = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "textual-dev>=1.5",
]

[project.urls]
Homepage = "https://github.com/jedrikjames/Watchtower"
Issues = "https://github.com/jedrikjames/Watchtower/issues"
Changelog = "https://github.com/jedrikjames/Watchtower/blob/main/CHANGELOG.md"

[project.scripts]
watchtower = "watchtower_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower_tui"]
artifacts = ["src/watchtower_tui/assets/*.png"]

[tool.hatch.build.targets.sdist]
include = ["src/watchtower_tui", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:watchtower.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM105",  # contextlib.suppress is not always clearer
    "RUF001",  # the logos and bars are "ambiguous" box-drawing on purpose
    "RUF002",
    "RUF003",
    "RUF012",  # Textual's BINDINGS/CSS are class-level lists by design
    "B027",    # SecretStore.close is an optional hook, not an abstract method
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF006"]

[tool.ruff.format]
quote-style = "double"
