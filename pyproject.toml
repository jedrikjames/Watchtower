[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# "watchtower" on PyPI is an unrelated CloudWatch logging handler, so the
# distribution is watchtower-tui. The import package and the command are both
# plain "watchtower".
name = "watchtower-tui"
version = "0.1.2"
description = "A small terminal dashboard for the usage limits on your Codex and Claude accounts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Watchtower contributors" }]
keywords = ["tui", "terminal", "usage", "quota", "codex", "claude", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "keyring>=24.0",
    "cryptography>=42.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Real provider icons on terminals that speak Sixel or Kitty graphics. Kept
# optional because Pillow is 7 MB and the braille marks work everywhere.
images = [
    "textual-image>=0.7",
    "pillow>=10.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "textual-dev>=1.5",
]

[project.urls]
Homepage = "https://github.com/jedrikjames/Watchtower"
Issues = "https://github.com/jedrikjames/Watchtower/issues"
Changelog = "https://github.com/jedrikjames/Watchtower/blob/main/CHANGELOG.md"

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]
artifacts = ["src/watchtower/assets/*.png"]

[tool.hatch.build.targets.sdist]
include = ["src/watchtower", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:watchtower.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM105",  # contextlib.suppress is not always clearer
    "RUF001",  # the logos and bars are "ambiguous" box-drawing on purpose
    "RUF002",
    "RUF003",
    "RUF012",  # Textual's BINDINGS/CSS are class-level lists by design
    "B027",    # SecretStore.close is an optional hook, not an abstract method
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF006"]

[tool.ruff.format]
quote-style = "double"
